name: ShopFlow CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 120337555647

jobs:
  # ─── Security Scan ──────────────────────────────────────────────
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Scan User Service
        run: trivy fs --exit-code 0 --severity HIGH,CRITICAL services/user-service/

      - name: Scan Product Service
        run: trivy fs --exit-code 0 --severity HIGH,CRITICAL services/product-service/

      - name: Scan Order Service
        run: trivy fs --exit-code 0 --severity HIGH,CRITICAL services/order-service/

  # ─── Build & Push to ECR ────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/shopflow-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & push user-service
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/shopflow-user-service:${{ steps.meta.outputs.tag }} services/user-service/
          docker push ${{ steps.login-ecr.outputs.registry }}/shopflow-user-service:${{ steps.meta.outputs.tag }}

      - name: Build & push product-service
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/shopflow-product-service:${{ steps.meta.outputs.tag }} services/product-service/
          docker push ${{ steps.login-ecr.outputs.registry }}/shopflow-product-service:${{ steps.meta.outputs.tag }}

      - name: Build & push order-service
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/shopflow-order-service:${{ steps.meta.outputs.tag }} services/order-service/
          docker push ${{ steps.login-ecr.outputs.registry }}/shopflow-order-service:${{ steps.meta.outputs.tag }}

  # ─── Deploy to Lambda ────────────────────────────────────────────
  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/shopflow-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Package & deploy user-service
        run: |
          cd services/user-service
          npm install --production
          zip -r function.zip index.js node_modules package.json
          aws lambda update-function-code \
            --function-name shopflow-user-service \
            --zip-file fileb://function.zip

      - name: Package & deploy product-service
        run: |
          cd services/product-service
          npm install --production
          zip -r function.zip index.js node_modules package.json
          aws lambda update-function-code \
            --function-name shopflow-product-service \
            --zip-file fileb://function.zip

      - name: Package & deploy order-service
        run: |
          cd services/order-service
          npm install --production
          zip -r function.zip index.js node_modules package.json
          aws lambda update-function-code \
            --function-name shopflow-order-service \
            --zip-file fileb://function.zip

      - name: Deployment summary
        run: |
          echo "✅ ShopFlow deployed successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Services: user-service, product-service, order-service"
